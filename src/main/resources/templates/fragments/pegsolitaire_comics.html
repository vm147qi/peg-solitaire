<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>PegSolitaire Comics</title>
    <link rel="stylesheet" type="text/css" href="/css/styleComics.css">
    <style>

        /* Menu */
        .home-btn {
            position:  fixed;
            top: 565px;
            left: 13px;
            background-color: #4e6e69;
            color: white;
            border: none;
            width: 70px;
            height: 70px;
            font-size: 24px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background-color 0.3s ease, transform 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 15;
            text-decoration: none;
        }
        .home-btn:hover {
            background-color: #3a5550;
            transform: scale(1.1);
        }
        .home-btn:active {
            transform: scale(0.95);
        }

        /* SKIP */
        .skip-btn {
            position:  fixed;
            top: 565px;
            left: 1450px;
            background-color: #4e6e69;
            color: white;
            border: none;
            width: 70px;
            height: 70px;
            font-size: 24px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background-color 0.3s ease, transform 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 15;
            text-decoration: none;
        }
        .skip-btn:hover {
            background-color: #3a5550;
            transform: scale(1.1);
        }
        .skip-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

<div class="footer-text">© 2025 Mukosii. Peg Solitaire.</div>
<canvas id="particles"></canvas>

<a href="/pegsolitaire/menu" class="home-btn" title="Menu">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
         stroke="currentColor" stroke-width="1.5" width="30" height="30">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
    </svg>
</a>

<a href="/pegsolitaire/levels" class="skip-btn" title="Skip">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 8.689c0-.864.933-1.406 1.683-.977l7.108 4.061a1.125 1.125 0 0 1 0 1.954l-7.108 4.061A1.125 1.125 0 0 1 3 16.811V8.69ZM12.75 8.689c0-.864.933-1.406 1.683-.977l7.108 4.061a1.125 1.125 0 0 1 0 1.954l-7.108 4.061a1.125 1.125 0 0 1-1.683-.977V8.69Z" />
    </svg>
</a>

<div class="top-border"></div>
<div class="bottom-border"></div>
<div id="pressEnterText">Press Enter to Continue...</div>


<div class="comic-frame-container" id="frame1">
    <div class="comic-panel panel-1">
        <img src="/images/comics1.png" alt="Comic Scene 1">
    </div>

    <div class="comic-panel panel-2" id="secondPanel">
        <img src="/images/comics2.png" alt="Comic Scene 2">
    </div>

    <div class="comic-panel panel-3" id="thirdPanel">
        <img src="/images/comics3.png" alt="Comic Scene 3">
    </div>

    <div class="comic-panel panel-4" id="fourthPanel">
        <img src="/images/comics4.png" alt="Comic Scene 4">
    </div>
</div>


<div class="comic-frame-container-2" id="frame2">
    <div class="comic-panel panel-5" id="fifthPanel">
        <img src="/images/comics5.png" alt="Comic Scene 5">
    </div>
    <div class="comic-panel panel-6" id="sixthPanel">
        <img src="/images/comics6.png" alt="Comic Scene 6">
    </div>
    <div class="comic-panel panel-7" id="seventhPanel">
        <img src="/images/comics7.png" alt="Comic Scene 7">
    </div>
</div>

<script>
    let currentPanel = 1;
    document.addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            if (currentPanel === 1) {
                document.getElementById("secondPanel").classList.add("show");
                currentPanel = 2;
            } else if (currentPanel === 2) {
                document.getElementById("thirdPanel").classList.add("show");
                currentPanel = 3;
            } else if (currentPanel === 3) {
                document.getElementById("fourthPanel").classList.add("show");
                currentPanel = 4;
            } else if (currentPanel === 4) {

                document.getElementById("frame1").style.display = "none";
                document.getElementById("frame2").style.display = "block";
                document.getElementById("fifthPanel").classList.add("show");
                currentPanel = 5;
        } else if (currentPanel === 5) {
            document.getElementById("sixthPanel").classList.add("show");
            currentPanel = 6;
        }else if (currentPanel === 6) {
                document.getElementById("seventhPanel").classList.add("show");
                currentPanel = 7;
            }  else if (currentPanel === 7) {
            window.location.href = "/pegsolitaire/levels";
        }
        }
    });


    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    let particles = [];
    for (let i = 0; i < 100; i++) {
        particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            radius: Math.random() * 3,
            dx: (Math.random() - 0.5) * 0.5,
            dy: (Math.random() - 0.5) * 0.5
        });
    }
    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.fill();
            p.x += p.dx;
            p.y += p.dy;
            if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
            if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
        });
        requestAnimationFrame(animate);
    }
    animate();

</script>
</body>
</html>
