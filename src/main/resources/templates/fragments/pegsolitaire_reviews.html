<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>PegSolitaire LeaderBoard</title>
    <link rel="stylesheet" type="text/css" href="/css/styleReviews.css">
    <link rel="icon" href="/images/love_peg.png" type="image/png">
    <style>
        body {
            background-image: url('/images/rulesbackround.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
            text-shadow: 2px 2px 4px black;
            overflow: hidden;
        }

        .parallax {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -2;
            background: url('/images/rulesbackround.png') no-repeat center center fixed;
            background-size: cover;
            animation: parallax 6s linear infinite;
        }

        @keyframes parallax {
            0% { transform: translateY(0); }
            50% { transform: translateY(7%); }
            100% { transform: translateY(0); }
        }

        .top-border, .bottom-border {
            position: absolute;
            width: 100%;
            height: 45px;
            background-color: #4e6e69;
            z-index: 10;
        }
        .top-border {
            top: 0;
        }

        .bottom-border {
            bottom: 0;
        }

        .footer-text {
            position: absolute;
            bottom: 10px;
            width: 100%;
            text-align: center;
            font-size: 16px;
            color: white;
            z-index: 11;
        }

        /* Menu */
        .home-btn {
            position:  fixed;
            top: 565px;
            left: 10px;
            background-color: #4e6e69;
            color: white;
            border: none;
            width: 70px;
            height: 70px;
            font-size: 24px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background-color 0.3s ease, transform 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 15;
            text-decoration: none;
        }
        .home-btn:hover {
            background-color: #3a5550;
            transform: scale(1.1);
        }
        .home-btn:active {
            transform: scale(0.95);
        }

        textarea {
            width: 400px;
            height: 100px;
            padding: 10px;
            border-radius: 10px;
            border: none;
            resize: none;
            margin-top: 20px;
            font-size: 16px;
        }

        button[type="submit"] {
            margin-top: 10px;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background-color: #4e6e69;
            color: white;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        button[type="submit"]:hover {
            background-color: #3a5550;
        }

        ul {
            margin-top: 30px;
            list-style-type: none;
            padding: 0;
        }

        li {
            margin-bottom: 15px;
            font-size: 18px;
        }


        .leaderboard-title {
            font-size: 60px;
            font-weight: 800;
            margin-bottom: -5px;
            text-align: center;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #fff;
            background: linear-gradient(45deg, gold, #f2edcc);
            -webkit-background-clip: text;
            background-clip: text;
            text-shadow: 3px 3px 8px rgba(0, 0, 0, 0.6);
            animation: fadeIn 1s ease-out;
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(-30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }


        .add-comment-btn {
            position: fixed;
            bottom: 63px;
            right: 13px;
            background-color: #4e6e69;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 21px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            transition: background-color 0.3s ease, transform 0.2s ease;
            z-index: 20;
        }
        .add-comment-btn:hover {
            background-color: #3a5550;
            transform: scale(1.1);
        }
        .home-btn:active {
            transform: scale(0.95);
        }


        /* Модальне вікно */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            padding-top: 140px;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.7);
        }

        .modal-content {
            background-color: #fefefe;
            margin: auto;
            padding: 5px 10px;
            border: 1px solid #888;
            width: 380px;
            height: 300px;
            border-radius: 20px;
            font-family: 'Poppins', sans-serif;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            position: relative;
            color: #333;
            animation: fadeIn 0.4s ease;
        }

        .modal-content h2 {
            margin-top: 0;
            margin-bottom: 5px;
            font-weight: 600;
            text-align: center;
            color: #e2e8f0;
            font-size: 36px;
            text-shadow: none;
        }

        .modal-content form {
            margin-top: 0;
            padding-top: 0;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #e2e8f0;
            cursor: pointer;
            text-shadow: none;
        }

        .close-btn:hover {
            color: #93949e;
        }

        .modal-content textarea {
            width: 90%;
            margin-left: 7px;
            margin-top: 5px;
            display: block;
            height: 130px;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #ccc;
            font-size: 16px;
            resize: none;
            background-color: #f6fbff;
        }

        .modal-content button[type="submit"] {
            background-color: #e2e8f0;
            color: #7b7b7c;
            border: none;
            font-size: 16px;
            border-radius: 12px;
            cursor: pointer;
            width: 100px;
            height: 40px;
            margin: 15px;
        }

        .modal-content button[type="submit"]:hover {
            background-color: #e2e8f0;
        }

        .rating-and-button {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-left: 7px;
            margin-right: 7px;
        }

        /* Зірки */
        .rating-stars {
            text-shadow: none;
            margin: 0;
        }

        .rating-stars input[type="radio"] {
            display: none;
        }

        .rating-stars label {
            font-size: 35px;
            color: lightgray;
            cursor: pointer;
            transition: color 0.3s;
        }

        .rating-stars input[type="radio"]:checked ~ label,
        .rating-stars label:hover,
        .rating-stars label:hover ~ label {
            color: #6c8a95;
        }


        .comments-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 30px;
            position: relative;
            max-width: 90%;
            overflow: hidden;
        }

        .comments-scroll {
            overflow-x: auto;
            white-space: nowrap;
            max-width: 800px;
            padding: 10px;
            scroll-behavior: smooth;
            transition: scroll-left 0.3s ease;
        }

        .comments-scroll ul {
            display: flex;
            gap: 15px;
            padding: 0;
            margin: 0;
        }

        .comment-box {
            background-color: #fefefe;
            padding: 15px;
            border-radius: 15px;
            width: 220px;
            min-height: 120px;
            display: inline-block;
            color: #7b7b7c;
            text-align: left;
            font-size: 16px;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            position: relative;
            text-shadow: none;
        }

        .comment-box .player-avatar {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 35px;
            height: 35px;
            background-color: #69948d;
            border-radius: 50%;
            margin-right: 3px;
            vertical-align: middle;
        }
        .comment-box .player-avatar svg {
            width: 20px;
            height: 20px;
            stroke: white;
        }

        .comment-box strong {
            font-size: 18px;
            color: #333;
            text-shadow: none;
        }

        .comment-box em {
            font-size: 12px;
            color: #777;
            position: absolute;
            bottom: 10px;
            right: 10px;
            text-shadow: none;
        }



        .scroll-btn.custom-d-btn {
            background-color: #69948d;
            border: none;
            width: 50px;
            height: 70px;
            cursor: pointer;
            border-radius: 50% 0 0 50% / 50%;
            margin: 0 10px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .scroll-btn.custom-d-btn.right {
            border-radius: 0 50% 50% 0 / 50%;
        }

        .scroll-btn.custom-d-btn:hover {
            background-color: #69948d;
            transform: scale(1.05);
        }

        .play-icon {
            width: 0;
            height: 0;
            border-style: solid;
        }

        .play-icon.right-arrow {
            border-width: 12px 0 12px 18px;
            border-color: transparent transparent transparent #fff1d5;
        }

        .play-icon.left-arrow {
            border-width: 12px 18px 12px 0;
            border-color: transparent #fff1d5 transparent transparent;
        }



        .comments-scroll::-webkit-scrollbar {
            display: none;
        }

        .comments-scroll {
            overflow-x: auto;
            white-space: nowrap;
            max-width: 800px;
            padding: 10px;
            scroll-behavior: smooth;
        }

        .stars {
            color: gold;
            font-size: 1.2em;
        }




        .rating-summary {
            font-family: 'Arial', sans-serif;
            text-align: center;
            margin-top: 20px;
        }
        .rating-summary h3 {
            font-size: 1.5em;
            color: #ffffff;
            font-weight: 600;
        }
        .stars {
            color: gold;
            font-size: 1.5em;
            animation: ratingAnimation 1s ease-in-out;
        }
        @keyframes ratingAnimation {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        .vote-count {
            font-size: 1em;
            color: #ffffff;
            margin-top: 10px;
        }
        .vote-count span {
            font-weight: bold;
            color: #ffffff;
        }
    </style>
</head>
<body>
<div class="top-border"></div>
<div class="bottom-border"></div>

<div class="footer-text">© 2025 Mukosii. Peg Solitaire.</div>

<div class="parallax"></div>

<a href="/pegsolitaire/menu" class="home-btn" title="Menu">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
         stroke="currentColor" stroke-width="1.5" width="30" height="30">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
    </svg>
</a>

<div class="leaderboard-title">REVIEWS</div>

<h3>Latest Comments:</h3>

<button class="add-comment-btn" onclick="openModal()">Add Comment</button>

<div id="commentModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h2>Send Feedback</h2>
        <form action="/pegsolitaire/comment" method="post">
            <textarea name="commentText" placeholder="Your feedback..." required></textarea>
            <div class="rating-and-button">
                <div class="rating-stars">
                    <input type="radio" id="star5" name="rating" value="5"><label for="star5">★</label>
                    <input type="radio" id="star4" name="rating" value="4"><label for="star4">★</label>
                    <input type="radio" id="star3" name="rating" value="3"><label for="star3">★</label>
                    <input type="radio" id="star2" name="rating" value="2"><label for="star2">★</label>
                    <input type="radio" id="star1" name="rating" value="1" checked><label for="star1">★</label>
                </div>
                <button type="submit">Submit</button>
            </div>
        </form>
    </div>
</div>


<div class="comments-container">
    <button class="scroll-btn custom-d-btn left" onclick="scrollComments(-1)">
        <span class="play-icon left-arrow"></span>
    </button>
    <div class="comments-scroll">
        <ul>
            <th:block th:each="entry : ${commentsWithRatings}">
            <li class="comment-box">
                    <span class="player-avatar">
                          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                               stroke-width="1.5" stroke="currentColor" width="24" height="24">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
                        </svg>
                    </span>
                    <strong th:text="${entry.comment.player}">Player</strong><br>
                <span class="stars" th:utext="${'★'.repeat(entry.rating)}">★★★★★</span><br>
                    <span th:text="${entry.comment.comment}">Коментар</span><br>
                    <em th:text="${#dates.format(entry.comment.commentedOn, 'dd.MM.yyyy HH:mm')}">дата</em>
                </li>
            </th:block>
        </ul>
    </div>
    <button class="scroll-btn custom-d-btn right" onclick="scrollComments(1)">
        <span class="play-icon right-arrow"></span>
    </button>
</div>

<div class="rating-summary">
    <h3>Rating:
        <span class="stars" th:utext="${'★'.repeat(avgRating)}"></span>
        ( <span th:text="${voteCount}">0</span> Votes)
    </h3>
</div>

</body>
<script>
    function openModal() {
        document.getElementById("commentModal").style.display = "block";
    }

    function closeModal() {
        document.getElementById("commentModal").style.display = "none";
    }

    window.onclick = function(event) {
        const modal = document.getElementById("commentModal");
        if (event.target == modal) {
            modal.style.display = "none";
        }
    }


    function scrollComments(direction) {
        const container = document.querySelector('.comments-scroll');
        const commentWidth = document.querySelector('.comment-box').offsetWidth + 15;
        const scrollAmount = commentWidth * 3;
        const targetScroll = container.scrollLeft + direction * scrollAmount;

        const scrollDuration = 500;
        const startScroll = container.scrollLeft;
        const distance = targetScroll - startScroll;
        let startTime = null;

        function smoothScroll(timestamp) {
            if (!startTime) startTime = timestamp;
            const progress = timestamp - startTime;
            const scrollStep = easeInOutCubic(progress, startScroll, distance, scrollDuration);

            container.scrollLeft = scrollStep;

            if (progress < scrollDuration) {
                window.requestAnimationFrame(smoothScroll);
            } else {
                container.scrollLeft = targetScroll;
            }
        }

        window.requestAnimationFrame(smoothScroll);
    }

    function easeInOutCubic(t, b, c, d) {
        t /= d / 2;
        if (t < 1) return c / 2 * t * t * t + b;
        t -= 2;
        return c / 2 * (t * t * t + 2) + b;
    }
</script>
</html>
