<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>PegSolitaire LeaderBoard</title>
    <link rel="stylesheet" type="text/css" href="/css/styleLeaderBoard.css">

    <style>
        body {
            background-image: url('/images/rulesbackround.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: #fff;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.7);
            overflow: hidden;
        }

        .parallax {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -2;
            background: url('/images/rulesbackround.png') no-repeat center center fixed;
            background-size: cover;
            animation: parallax 6s linear infinite;
        }

        @keyframes parallax {
            0% { transform: translateY(0); }
            50% { transform: translateY(7%); }
            100% { transform: translateY(0); }
        }

        .top-border, .bottom-border {
            position: absolute;
            width: 100%;
            height: 50px;
            background-color: #4e6e69;
            z-index: 10;
        }
        .top-border {
            top: 0;
        }
        .bottom-border {
            bottom: 0;
        }
        .footer-text {
            position: absolute;
            bottom: 10px;
            width: 100%;
            text-align: center;
            font-size: 14px;
            color: #ddd;
            z-index: 11;
        }


        .leaderboard-title {
            font-size: 60px;
            font-weight: 800;
            margin-bottom: -5px;
            text-align: center;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #fff;
            background: linear-gradient(45deg, gold, #f2edcc);
            -webkit-background-clip: text;
            background-clip: text;
            text-shadow: 3px 3px 8px rgba(0, 0, 0, 0.6);
            animation: fadeIn 1s ease-out;
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(-30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .leaderboard-table {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 20px 40px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 480px;
            max-height: 80vh;
            overflow-y: auto;
            color: white;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .leaderboard-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 20px;
            border-radius: 12px;
            background-color: #eceadb;
            font-size: 20px;
            font-weight: 500;
            transition: transform 0.2s ease;
        }

        .leaderboard-row:hover {
            transform: scale(1.01);
        }

        .first-place {
            background-color: #69948d;
            border-left: 6px solid #293b38;
        }

        .second-place {
            background-color: #84bab1;
            border-left: 6px solid #69948d;
        }

        .third-place {
            background-color: #9fe0d5;
            border-left: 6px solid #84bab1;
        }

        .rank-badge {
            font-weight: bold;
            font-size: 24px;
            width: 40px;
        }

        .player-info {
            flex-grow: 1;
            margin-left: 15px;
        }

        .player-name {
            font-weight: 600;
            font-size: 18px;
        }

        .player-score {
            font-size: 18px;
            font-weight: 700;
            color: white;
        }

        .avatar  {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 35px;
            height: 35px;
            background-color: #638881;
            border-radius: 50%;
            margin-right: 3px;
            vertical-align: middle;
        }
        .avatar .player-avatar svg {
            width: 20px;
            height: 20px;
            color: white;
        }
        .avatar svg {
            color: white;
        }

        /* Menu */
        .home-btn {
            position:  fixed;
            top: 565px;
            left: 10px;
            background-color: #4e6e69;
            color: white;
            border: none;
            width: 70px;
            height: 70px;
            font-size: 24px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background-color 0.3s ease, transform 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 15;
            text-decoration: none;
        }
        .home-btn:hover {
            background-color: #3a5550;
            transform: scale(1.1);
        }
        .home-btn:active {
            transform: scale(0.95);
        }


        .top-player-card {
            position: absolute;
            left: 130px;
            top: 130px;
            width: 300px;
            height: 400px;
            background: #f3f1e4;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            padding: 20px 15px;
            text-align: center;
            color: #333;
            font-family: 'Poppins', sans-serif;
            z-index: 10;


            animation: popIn 0.6s ease-out forwards;
            opacity: 0;
            transform: scale(0.8);
        }
        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.8);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .top-rank-badge {
            background-color: #69948d;
            color: white;
            font-weight: bold;
            border-radius: 10px 10px 0 0;
            padding: 5px 10px;
            font-size: 30px;
            margin-bottom: 10px;
        }

        .avatarr  {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 120px;
            height: 120px;
            background-color: #638881;
            border-radius: 50%;
            margin-right: 3px;
            vertical-align: middle;
        }
        .avatarr svg {
            color: white;
            width: 100px;
            height: 100px;
        }

        .top-player-stars {
            font-size: 50px;
            color: orange;
            margin-bottom: 7px;
        }

        .top-player-name {
            font-size: 22px;
            font-weight: bold;
            color: white;
        }

        .top-player-role {
            font-size: 17px;
            color: #777;
            margin-bottom: 10px;
        }

        .top-player-score {
            font-size: 25px;
            font-weight: bold;
            color: white;
            margin-bottom: 20px;
        }

        .score-background {
            background-color: rgba(114, 156, 148, 0.66);
            border-radius: 10px;
            padding: 10px 0;
            margin: 0 auto 15px auto;
            width: 80%;
        }

        .top-player-score {
            font-size: 30px;
            font-weight: bold;
            color: white;
            margin: 0;
        }

        .score-label {
            font-size: 14px;
            color: #555;
        }


    </style>
</head>
<body>
<div class="top-border"></div>
<div class="bottom-border"></div>
<div class="footer-text">© 2025 Mukosii. Peg Solitaire.</div>

<div class="parallax"></div>

<a href="/pegsolitaire/menu" class="home-btn" title="Menu">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
         stroke="currentColor" stroke-width="1.5" width="30" height="30">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
    </svg>
</a>

<div class="top-player-card">
    <div class="top-rank-badge">1<sup>st</sup> Rank</div>
    <span class="avatarr">
                          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                               stroke-width="1.5" stroke="currentColor" width="24" height="24">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                      d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
                        </svg>
    </span>
    <div class="top-player-stars">★★★</div>
    <div class="top-player-name" th:text="${scores[0].player}"></div>
    <div class="top-player-role">Best player</div>
    <div class="score-background">
        <div class="top-player-score" th:text="${scores[0].points}"></div>
        <div class="score-label">Points</div>
    </div>
</div>


<div class="leaderboard-title">LEADERBOARD</div>
<div class="leaderboard-table">
    <div th:each="score, iterStat : ${scores}">
        <div th:if="${iterStat.index < 7}" class="leaderboard-row"
             th:classappend=" ${iterStat.index == 0} ? 'first-place' :
                              (${iterStat.index == 1} ? 'second-place' :
                              (${iterStat.index == 2} ? 'third-place' : ''))">
            <div class="rank-badge" th:text="${iterStat.index + 1} + '.'">1.</div>
                    <span class="avatar">
                          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                               stroke-width="1.5" stroke="currentColor" width="24" height="24">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                      d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
                        </svg>
                    </span>
            <div class="player-info">
                <span class="player-name" th:text="${score.player}">Player</span>
            </div>
            <div class="player-score" th:text="'Score ' + ${score.points}">Score</div>
        </div>
    </div>
</div>


</body>
</html>
