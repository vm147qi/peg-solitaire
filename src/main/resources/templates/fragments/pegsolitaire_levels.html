<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <title>Peg Solitaire levels</title>
    <style>
        body {
            background-image: url('/images/backround.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
            text-shadow: 2px 2px 4px black;
            overflow: hidden;
        }

        .top-border, .bottom-border {
            position: absolute;
            width: 100%;
            height: 45px;
            background-color: #4e6e69;
            z-index: 10;
        }
        .top-border { top: 0; }
        .bottom-border { bottom: 0; }

        .footer-text {
            position: absolute;
            bottom: 10px;
            width: 100%;
            text-align: center;
            font-size: 16px;
            color: white;
            z-index: 12;
        }

        .card {
            position: relative;
            width: 750px;
            height: 420px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 0.6em;
            box-shadow: 0.3em 0.3em 0.7em rgba(0, 0, 0, 0.3), 0 0 20px rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.18);
            z-index: 14;
        }

        .play-button-wrapper {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
        }

        .card:hover {
            background: rgba(255, 255, 255, 0.3);
            box-shadow: 0.3em 0.3em 1em rgba(0, 0, 0, 0.5), 0 0 30px rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        .card:active {
            transform: scale(1);
            box-shadow: 0.3em 0.3em 0.5em rgba(0, 0, 0, 0.3), 0 0 15px rgba(255, 255, 255, 0.1);
        }


        .play-button {
            border: 1px solid white;
            padding: 12px 35px;
            border-radius: 30px;
            background-color: #4e6e69;
            font-weight: bolder;
            font-size: 24px;
            box-shadow: 0px 0px 1px;
            transition: all 0.3s ease;
            cursor: pointer;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        .play-button:hover {
            transform: translateY(-10px);
            box-shadow: 0px 7px 1px rgb(0, 0, 0);
            border: 1px solid black;
        }

        .play-button:active {
            transform: translateY(10px);
            box-shadow: 0px 0px 1px;
        }


        .decorated-image {
            border-radius: 20px;
            box-shadow: 0 0 15px rgba(0,0,0,0.5), 0 0 10px rgba(255, 255, 255, 0.2);
            border: 5px solid rgba(255, 255, 255, 0.2);
            background-color: rgba(255,255,255,0.05);
        }

        .decorated-image:hover {
            box-shadow: 0 0 25px rgba(255,255,255,0.6), 0 0 15px rgba(78, 110, 105, 0.7);
        }


        .level-preview-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .level-label {
            background-color: #4e6e69;
            color: white;
            padding: 8px 20px;
            border-radius: 12px 12px 0 0;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: -10px;
            z-index: 2;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            position: relative;
            top: -10px;
        }


        .button-container {
            display: flex;
            justify-content: center;
            margin: 20px;
        }

        .button-3d {
            -webkit-appearance: none;
            appearance: none;
            position: relative;
            border-width: 0;
            padding: 0 8px;
            min-width: 4em;
            min-height: 4em;
            box-sizing: border-box;
            background: transparent;
            font: inherit;
            cursor: pointer;
            margin: 10px;
            border-radius: 20px;
        }

        .button-top {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 2;
            padding: 8px 16px;
            transform: translateY(0);
            color: #fff;
            background-image: linear-gradient(145deg, #c3d6d0, #4e6e69);
            text-shadow: 0 -1px rgba(0, 0, 0, 0.25);
            border-radius: 20px;
            transition: transform 0.3s, border-radius 0.3s, background 10s;
        }

        .button-3d:active .button-top {
            border-radius: 10px 10px 8px 8px / 8px;
            transform: translateY(2px);
            background-image: linear-gradient(145deg, #4e6e69, #c3d6d0);
        }

        .button-bottom {
            position: absolute;
            z-index: 1;
            bottom: 1px;
            left: 4px;
            border-radius: 20px;
            padding-top: 6px;
            width: calc(100% - 8px);
            height: calc(100% - 10px);
            background-image: linear-gradient(145deg, #4e6e69, #c3d6d0);
            box-shadow: 0px 2px 3px 0px rgba(0, 0, 0, 0.5);
            transition: border-radius 0.2s, padding-top 0.2s;
        }

        .button-base {
            position: absolute;
            z-index: 0;
            top: 4px;
            left: 0;
            border-radius: 20px;
            width: 103%;
            height: calc(103% - 4px);
            background-color: rgba(0, 0, 0, 0.15);
            box-shadow: 0 1px 1px 0 rgba(255, 255, 255, 0.75),
            inset 0 2px 2px rgba(0, 0, 0, 0.25);
            transition: border-radius 0.2s, padding-top 0.2s;
        }

        .button-3d:active .button-bottom {
            border-radius: 10px 10px 8px 8px / 8px;
            padding-top: 0;
        }

        .button-3d:active .button-base {
            border-radius: 10px 10px 8px 8px / 8px;
        }


        /* Home button */
        .home-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: #4e6e69;
            color: white;
            border: none;
            width: 60px;
            height: 60px;
            font-size: 24px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: background-color 0.3s ease, transform 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 15;
        }
        .home-btn:hover {
            background-color: #3a5550;
            transform: scale(1.1);
        }
        .home-btn:active {
            transform: scale(0.95);
        }


        .side-peg {
            position: absolute;
            bottom: -28vh;
            width: 50vw;
            height: 95vh;
            background-image: url('/images/girlpeg.png');
            background-size: contain;
            background-repeat: no-repeat;
            transform-origin: center bottom;
            transition: transform 0.3s ease;
            z-index: 13;
            opacity: 0.95;
            pointer-events: auto;
        }
        .side-peg.right {
            right: -61vw;
        }

        .side-peg.right:hover {
            transform: rotateX(30deg) translateY(-40px) translateZ(-50px);
        }

        .speech-bubble {
            position: absolute;
            top: -10%;
            left: -60%;
            width: 600px;
            z-index: 14;
            transition: transform 0.3s ease;
        }

        .side-peg.right:hover .speech-bubble {
            transform: translateY(-40px) translateZ(-50px);
        }
        .side-peg img.speech-bubble {
            pointer-events: none;
        }



        .solved {
            border: 6px solid gold;
            border-radius: 20px;
            padding: 4px;
            box-sizing: border-box;
            animation: solved-glow 2s infinite ease-in-out;
            position: relative;
        }
        @keyframes solved-glow {
            0% { box-shadow: 0 0 10px gold; }
            50% { box-shadow: 0 0 25px yellow; }
            100% { box-shadow: 0 0 10px gold; }
        }
        .solved-banner {
            position: absolute;
            top: 10px;
            left: 10px;
            background: linear-gradient(135deg, gold, orange);
            color: white;
            font-weight: bold;
            padding: 6px 16px;
            border-radius: 12px;
            font-size: 16px;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .solved-banner::before {
            font-size: 20px;
        }

    </style>
</head>
<body>

<div class="top-border"></div>
<div class="bottom-border"></div>
<div class="footer-text">© 2025 Mukosii. Peg Solitaire.</div>

<div class="card">

    <div class="side-peg right">
        <img src="/images/Speach_level.png" alt="speech" class="speech-bubble">
    </div>

    <a href="/pegsolitaire/menu" class="home-btn" title="Menu">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
             stroke="currentColor" stroke-width="1.5" width="30" height="30">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
        </svg>
    </a>
    <div class="level-selector" style="text-align:center; padding:42px;">

        <div style="display:flex; align-items:center; justify-content:center;">

            <div class="button-container">
                <button class="button-3d" onclick="location.href='/pegsolitaire/levels/prev'">
                    <div class="button-top">
                        <span class="material-icons">❮</span>
                    </div>
                    <div class="button-bottom"></div>
                    <div class="button-base"></div>
                </button>
            </div>

            <div class="level-preview-wrapper">

                <div class="level-label" th:text="${currentLevel}">Level</div>
                <div class="solved-wrapper" th:classappend="${isSolved} ? 'solved' : ''">
                    <a href="/pegsolitaire/startSelected">
                        <img th:src="@{${imagePath}}" alt="level" width="250" height="250" class="decorated-image">
                    </a>
                    <div class="solved-banner" th:if="${isSolved}">Solved</div>
                </div>
            </div>

            <div class="button-container">
                <button class="button-3d" onclick="location.href='/pegsolitaire/levels/next'">
                    <div class="button-top">
                        <span class="material-icons">❯</span>
                    </div>
                    <div class="button-bottom"></div>
                    <div class="button-base"></div>
                </button>
            </div>
        </div>
        <br>


        <form th:action="@{/pegsolitaire/startSelected}" method="get" class="play-button-wrapper">
            <button type="submit"
                    class="play-button"
                    th:disabled="${currentLevel.ordinal() > unlockedLevelIndex and currentLevel.ordinal() != 0}"
                    th:style="${currentLevel.ordinal() > unlockedLevelIndex and currentLevel.ordinal() != 0} ? 'background-color: gray; cursor: not-allowed;' : ''">
                <span th:text="${currentLevel.ordinal() > unlockedLevelIndex and currentLevel.ordinal() != 0} ? '🔒 Locked' : 'PLAY'">PLAY</span>
            </button>
        </form>


    </div>
</div>

</body>
</html>
