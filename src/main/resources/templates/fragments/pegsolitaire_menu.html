<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>PegSolitaire Menu</title>
    <link rel="stylesheet" type="text/css" href="/css/styleMenu.css">
    <style>

    </style>
</head>
<body>

<div class="footer-text">© 2025 Mukosii. Peg Solitaire.</div>


<div class="top-border"></div>
<div class="bottom-border"></div>

<h1 class="title">Menu</h1>

<div class="menu-button-container" id="btn1">
    <button class="shadow__btn" onclick="location.href='/pegsolitaire/comics'">Play</button>
</div>

<div class="menu-button-container" id="btn2">
    <button class="shadow__btn" onclick="location.href='/pegsolitaire/rules'">Rules</button>
</div>

<div class="menu-button-container" id="btn3">
    <button class="shadow__btn" onclick="location.href='/pegsolitaire/leaderboard'">LeaderBoard</button>
</div>

<div class="menu-button-container" id="btn4">
    <button class="shadow__btn" onclick="location.href='/pegsolitaire/reviews'">Reviews</button>
</div>

<div class="menu-button-container" id="btn5">
    <button class="shadow__btn" onclick="location.href='/pegsolitaire/exit'">Exit</button>
</div>


<div class="side-peg right"></div>

<canvas id="particles"></canvas>

<script>
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    let particles = [];
    for (let i = 0; i < 100; i++) {
        particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            radius: Math.random() * 3,
            dx: (Math.random() - 0.5) * 0.5,
            dy: (Math.random() - 0.5) * 0.5
        });
    }
    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.fill();
            p.x += p.dx;
            p.y += p.dy;
            if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
            if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
        });
        requestAnimationFrame(animate);
    }
    animate();

    document.addEventListener('keydown', function(event) {
        if (event.key === "Enter") {
            window.location.href = "/pegsolitaire/menu";
        }
    });
</script>
</body>
</html>
