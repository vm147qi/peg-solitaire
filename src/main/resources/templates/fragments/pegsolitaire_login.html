<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - PegSolitaire</title>
    <link rel="stylesheet" type="text/css" href="/css/styleLogin.css">
    <link rel="icon" href="/images/love_peg.png" type="image/png">
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            position: relative;
            color: white;
        }

        .parallax {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -2;
            background: url('/images/rulesbackround.png') no-repeat center center fixed;
            background-size: cover;
            animation: parallax 6s linear infinite;
        }

        @keyframes parallax {
            0% { transform: translateY(0); }
            50% { transform: translateY(6%); }
            100% { transform: translateY(0); }
        }

        .top-border, .bottom-border {
            position: absolute;
            width: 100%;
            height: 45px;
            background-color: #4e6e69;
            z-index: 10;
        }
        .top-border {
            top: 0;
        }
        .bottom-border {
            bottom: 0;
        }

        .footer-text {
            position: absolute;
            bottom: 10px;
            width: 100%;
            text-align: center;
            font-size: 14px;
            color: #ddd;
            z-index: 11;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
            width: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        h2 {
            text-align: center;
            margin-bottom: 40px;
            color: black;
        }

        button[type="submit"] {
            width: 100%;
            padding: 12px;
            background-color: #69948d;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 30px;
        }

        button[type="submit"]:hover {
            background-color: #69948d;
        }

        /* Menu button */
        .home-btn {
            position: fixed;
            top: 565px;
            left: 10px;
            background-color: #4e6e69;
            color: white;
            border: none;
            width: 70px;
            height: 70px;
            font-size: 24px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background-color 0.3s ease, transform 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 15;
            text-decoration: none;
        }
        .home-btn:hover {
            background-color: #3a5550;
            transform: scale(1.1);
        }
        .home-btn:active {
            transform: scale(0.95);
        }

        /* New Input Design */
        .input__container {
            position: relative;
            background: #f0f0f0;
            padding: 20px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 15px;
            border: 4px solid #000;
            max-width: 100%;
            transition: all 400ms cubic-bezier(0.23, 1, 0.32, 1);
            transform-style: preserve-3d;
            transform: rotateX(10deg) rotateY(-10deg);
            perspective: 1000px;
            box-shadow: 10px 10px 0 #000;
        }

        .input__container:hover {
            transform: rotateX(5deg) rotateY(1deg) scale(1.05);
            box-shadow: 25px 25px 0 -5px #4e6e69, 25px 25px 0 0 #000;
        }

        .shadow__input {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            left: 0;
            bottom: 0;
            z-index: -1;
            transform: translateZ(-50px);
            background: linear-gradient(45deg, rgba(255, 107, 107, 0.4) 0%, rgba(255, 107, 107, 0.1) 100%);
            filter: blur(20px);
        }

        .input__button__shadow {
            cursor: pointer;
            border: 3px solid #000;
            background: #4e6e69;
            transition: all 400ms cubic-bezier(0.23, 1, 0.32, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            transform: translateZ(20px);
            position: relative;
            z-index: 3;
            font-weight: bold;
            text-transform: uppercase;
        }

        .input__button__shadow:hover {
            background: #4e6e69;
            transform: translateZ(10px) translateX(-5px) translateY(-5px);
            box-shadow: 5px 5px 0 0 #000;
        }

        .input__button__shadow svg {
            fill: #f0f0f0;
            width: 25px;
            height: 25px;
        }

        .input__search {
            width: 100%;
            outline: none;
            border: 3px solid #000;
            padding: 15px;
            font-size: 18px;
            background: #fff;
            color: #000;
            transform: translateZ(10px);
            transition: all 400ms cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            z-index: 3;
            font-family: "Roboto", Arial, sans-serif;
            letter-spacing: -0.5px;
        }

        .input__search::placeholder {
            color: #666;
            font-weight: bold;
            text-transform: uppercase;
        }

        .input__search:hover,
        .input__search:focus {
            background: #f0f0f0;
            transform: translateZ(20px) translateX(-5px) translateY(-5px);
            box-shadow: 5px 5px 0 0 #000;
        }

        .input__container::before {
            content: "USERNAME";
            position: absolute;
            top: -15px;
            left: 20px;
            background: #4e6e69;
            color: #f0f0f0;
            font-weight: bold;
            padding: 5px 10px;
            font-size: 14px;
            transform: translateZ(50px);
            z-index: 4;
            border: 2px solid #000;
        }
    </style>
</head>

<body>

<div class="parallax"></div>
<div class="top-border"></div>
<div class="bottom-border"></div>
<div class="footer-text">© 2025 Mukosii. Peg Solitaire.</div>

<a href="/pegsolitaire/menu" class="home-btn" title="Menu">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
         stroke="currentColor" stroke-width="1.5" width="30" height="30">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
    </svg>
</a>

<div class="login-container">
    <h2>Login to PegSolitaire</h2>
    <form action="/pegsolitaire/loginSubmit" method="POST">
        <div class="input__container">
            <div class="shadow__input"></div>
            <button type="button" class="input__button__shadow">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                     stroke="currentColor" stroke-width="1.5" width="24" height="24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
            </button>
            <input type="text" id="username" name="username" class="input__search" placeholder="Enter username" required
                   oninvalid="this.setCustomValidity('Please enter a username.')"
                   oninput="this.setCustomValidity('')">
        </div>

        <button type="submit">Submit</button>
    </form>
</div>

</body>
</html>
