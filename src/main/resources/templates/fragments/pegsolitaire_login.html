<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - PegSolitaire</title>
    <link rel="stylesheet" type="text/css" href="/css/styleLogin.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 300px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        .error-message {
            color: red;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Login to PegSolitaire</h2>

    <!-- Форма для вводу імені -->
    <form action="/pegsolitaire/loginSubmit" method="POST">
        <label for="username">Enter your name:</label>
        <input type="text" id="username" name="username" required>

        <button type="submit">Submit</button>
    </form>

    <!-- Повідомлення про помилку (якщо потрібно) -->
    <!-- <p class="error-message">Username is required!</p> -->
</div>

</body>
</html>
